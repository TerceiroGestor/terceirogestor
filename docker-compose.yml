services:
  mysql:
    image: mysql:8.0
    container_name: mysql-terceirogestor
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}/mysql
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&ssl=false"
    container_name: backend-terceirogestor
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      NODE_ENV: production
      DATABASE_URL: "mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&ssl=false"
    ports:
      - "3001:3001"
    volumes:
      - type: bind
        source: ./backend/uploads
        target: /app/uploads
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: frontend-terceirogestor
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_INTERNAL_URL: http://backend:3001
    ports:
      - "3000:3000"

  backup:
    image: alpine:3.20
    container_name: mysql-backup-terceirogestor
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: ${TZ:-UTC}
    volumes:
      - type: bind
        source: ${DATA_DIR:-./data}/backups
        target: /backups
    entrypoint: >-
      /bin/sh -c "apk add --no-cache mariadb-client tzdata >/dev/null
      && mkdir -p $$BACKUP_DIR
      && cat <<'EOF' > /usr/local/bin/backup.sh
      #!/bin/sh
      TS=$(date +%Y%m%d-%H%M%S)
      mysqldump -h \"$$MYSQL_HOST\" -P \"$$MYSQL_PORT\" -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" \
        | gzip > \"$$BACKUP_DIR/$$MYSQL_DATABASE-$$TS.sql.gz\"
      find \"$$BACKUP_DIR\" -type f -name \"$$MYSQL_DATABASE-*.sql.gz\" -mtime +$$BACKUP_KEEP_DAYS -delete
      EOF
      && chmod +x /usr/local/bin/backup.sh
      && echo '0 12 * * * /usr/local/bin/backup.sh' > /etc/crontabs/root
      && crond -f -l 2"
