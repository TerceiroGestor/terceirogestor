services:
  nginx:
    build:
      context: ./docker/nginx
    container_name: nginx-terceirogestor
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      PRIMARY_DOMAIN: ${NGINX_PRIMARY_DOMAIN:-localhost}
    ports:
      - "80:80"
